# ─────────────────────────────────────────────────────────────────────────────
# Task 4: 2-container CI/CD attack demo (PAPER ARTIFACT — INSECURE BY DESIGN).
#
# Reproduces reviewer #608A's requested demonstration: an attacker gets write
# access to /workspace/output.verified.ast without ever seeing NEURO_SIGNING_KEY.
#
# NOTE: the `run_demo.sh` script in this directory reproduces these exact steps
# without Docker (the verification run of record lives in results/ci_demo/).
#
#   Step 1 (Analyzer container):  has NEURO_SIGNING_KEY, runs the analyzer,
#                                 writes /workspace/output.verified.ast
#   Step 2 (Untrusted CI Action): no key, overwrites output.verified.ast with
#                                 the unsigned use-after-move exploit payload
#   Step 3 (Backend container):   reads output.verified.ast, runs the C++ backend
# ─────────────────────────────────────────────────────────────────────────────
version: "3.8"

services:
  analyzer:
    image: rust:1.83-bookworm
    container_name: citrust-analyzer
    working_dir: /src
    volumes:
      - ..:/src
      - workspace:/workspace
    environment:
      # Isolated to this service only — never passed to `poisoner`.
      NEURO_SIGNING_KEY: ci-demo-prod-signing-key-do-not-leak
    command: >
      bash -c "
        cargo build --release --example ci_payload -p tests &&
        target/release/examples/ci_payload normal /workspace/output.verified.ast
      "

  poisoner:
    image: rust:1.83-bookworm
    container_name: citrust-poisoner
    working_dir: /src
    depends_on: [analyzer]
    volumes:
      - ..:/src
      - workspace:/workspace
    # NOTE THE ABSENCE of NEURO_SIGNING_KEY / NEURO_SIGNING_KEY in this env.
    command: >
      bash -c "
        cargo build --release --example ci_payload -p tests &&
        target/release/examples/ci_payload exploit /workspace/output.verified.ast
      "

  backend:
    image: debian:bookworm-slim
    container_name: citrust-backend
    working_dir: /backend
    depends_on: [poisoner]
    volumes:
      - ./prebuilt/neuro_backend:/backend/neuro_backend
      - workspace:/workspace
    environment:
      NEURO_SIGNING_KEY: ci-demo-prod-signing-key-do-not-leak
    command: >
      bash -c "
        ./neuro_backend /workspace/output.verified.ast /workspace/out.ll;
        echo \"backend exit code: $$?\"
      "

volumes:
  workspace:
