syntax = "proto3";

package neuro.ast;

option csharp_namespace = "Neuro.AST";

// --- Source Metadata ---
message SourceLocation {
    uint32 line = 1;
    uint32 column = 2;
    string file_path = 3;
}

// --- The Root Program ---
message Program {
    string name = 1;
    repeated Function functions = 2;
}

// --- Functions ---
message Function {
    string name = 1;
    repeated Parameter parameters = 2;
    Type return_type = 3;
    repeated Statement body = 4;
    SourceLocation location = 5;
}

message Parameter {
    string name = 1;
    Type type = 2;
}

// --- Types ---
message Type {
    enum Kind {
        INT = 0;
        FLOAT = 1;
        BOOL = 2;
        STRING = 3;
        VOID = 4;
        CUSTOM = 5;
    }
    Kind kind = 1;
    string custom_name = 2; // Only used if kind is CUSTOM
}

// --- Statements ---
message Statement {
    SourceLocation location = 1;
    oneof stmt_kind {
        VariableDeclaration declaration = 2;
        Assignment assignment = 3;
        IfStatement if_stmt = 4;
        WhileStatement while_stmt = 5;
        ReturnStatement return_stmt = 6;
        Expression expression_stmt = 7; // For function calls as statements
    }
}

message VariableDeclaration {
    string name = 1;
    Type type = 2;
    Expression initializer = 3; // Required
    bool is_mutable = 4;
}

message Assignment {
    string target_name = 1;
    Expression value = 2;
}

message IfStatement {
    Expression condition = 1;
    repeated Statement true_branch = 2;
    repeated Statement false_branch = 3;
}

message WhileStatement {
    Expression condition = 1;
    repeated Statement body = 2;
}

message ReturnStatement {
    Expression value = 1; // Optional for void
}

// --- Expressions ---
message Expression {
    SourceLocation location = 1;
    oneof expr_kind {
        Literal literal = 2;
        VariableReference variable = 3;
        BinaryOperation binary_op = 4;
        UnaryOperation unary_op = 5;
        FunctionCall call = 6;
    }
}

message Literal {
    oneof value {
        int64 int_val = 1;
        double float_val = 2;
        bool bool_val = 3;
        string string_val = 4;
    }
}

message VariableReference {
    string name = 1;
}

message BinaryOperation {
    enum Operator {
        ADD = 0;
        SUB = 1;
        MUL = 2;
        DIV = 3;
        EQ = 4;
        NEQ = 5;
        LT = 6;
        GT = 7;
        LTE = 8;
        GTE = 9;
        AND = 10;
        OR = 11;
    }
    Operator op = 1;
    Expression left = 2;
    Expression right = 3;
}

message UnaryOperation {
    enum Operator {
        NEG = 0;
        NOT = 1;
    }
    Operator op = 1;
    Expression operand = 2;
}

message FunctionCall {
    string function_name = 1;
    repeated Expression arguments = 2;
}
