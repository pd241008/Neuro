[package]
name = "stm32_signing_station"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "station"
path = "src/bin/station.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "host_bench"
path = "src/bin/host_bench.rs"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["set-sp"] }
embedded-hal = "0.2"
nb = "1.1"
sha2 = { version = "0.10", default-features = false }
hmac = "0.12"
hex = { version = "0.4", optional = true }
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f407"], default-features = false }

[features]
default = []
host = ["hex"]
