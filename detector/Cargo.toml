[package]
name = "tbsg-detect"
version = "0.3.0"
edition = "2021"
description = "Detects trust boundary semantic gaps in IPC pipelines (v0.3.0: control-flow-guard vs pass-through read classification)"

[[bin]]
name = "tbsg-detect"
path = "src/main.rs"

[dependencies]
regex = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
