[package]
name = "tbsg-detect"
version = "0.2.0"
edition = "2021"
description = "Detects trust boundary semantic gaps in IPC pipelines"

[[bin]]
name = "tbsg-detect"
path = "src/main.rs"

[dependencies]
regex = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
