[package]
name = "neuro_cli"
version = "0.1.0"
edition = "2021"
authors = ["NEURO Team"]
description = "The Zero-Trust Orchestrator for the NEURO Compiler Pipeline"

[dependencies]
# CLI & UI
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
colored = "2.0"
miette = { version = "5.5", features = ["fancy"] }
thiserror = "1.0"

# Serialization & Communication
prost = "0.11" # For handling the AST Protobuf
prost-types = "0.11"

# Process Management
tokio = { version = "1.0", features = ["full"] }
which = "4.4"

[build-dependencies]
prost-build = "0.11"
