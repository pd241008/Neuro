[package]
name = "neuro_cli"
version = "0.1.0"
edition = "2021"
authors = ["NEURO Team"]
description = "The Zero-Trust Orchestrator for the NEURO Compiler Pipeline"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17"
colored = "2.0"
miette = { version = "5.5", features = ["fancy"] }
tokio = { version = "1.0", features = ["full"] }
which = "4.4"
analyzer = { path = "../analyzer" }
